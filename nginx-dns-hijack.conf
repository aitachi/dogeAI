# Nginx配置补丁 - 完整DNS劫持支持
#
# 添加此配置到 /etc/nginx/conf.d/claude-proxy-443.conf
# 或添加到现有443 server块中

# ========================================
# 完整DNS劫持配置 (api.anthropic.com)
# ========================================

server {
    listen 443 ssl http2;
    server_name api.anthropic.com aitachi.cloud 59.110.40.73;

    # SSL证书 (支持api.anthropic.com)
    ssl_certificate /opt/claude-proxy/ssl/cert.pem;
    ssl_certificate_key /opt/claude-proxy/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 日志
    access_log /var/log/nginx/claude-proxy-443-access.log;
    error_log /var/log/nginx/claude-proxy-443-error.log;

    # 根路径
    location = / {
        return 200 '{"status":"ok","service":"Claude Code Proxy","api":"https://api.anthropic.com"}';
        add_header Content-Type application/json;
    }

    # ========================================
    # Claude API 核心端点 (直接访问)
    # ========================================

    # 消息API (最重要)
    location /v1/messages {
        proxy_pass http://127.0.0.1:3001/v1/messages;
        proxy_http_version 1.1;

        # Host头 (重要：保持原始Host)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / SSE支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时配置
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # 流式响应
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # 模型列表
    location /v1/models {
        proxy_pass http://127.0.0.1:3001/v1/models;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 模型详情
    location /v1/models/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Token计数
    location /v1/messages/count_tokens {
        proxy_pass http://127.0.0.1:3001/v1/messages/count_tokens;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ========================================
    # 平台API端点
    # ========================================

    # 所有/api/路径
    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 组织相关
    location /v1/organizations {
        proxy_pass http://127.0.0.1:3001/v1/organizations;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /v1/organizations/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 用户信息
    location /v1/me {
        proxy_pass http://127.0.0.1:3001/v1/me;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /v1/dashboard/ {
        proxy_pass http://127.0.0.1:3001/v1/dashboard/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Usage统计
    location /v1/usage {
        proxy_pass http://127.0.0.1:3001/v1/usage;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ========================================
    # OAuth端点
    # ========================================

    location /oauth/ {
        proxy_pass http://127.0.0.1:3001/oauth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ========================================
    # OIDC配置
    # ========================================

    location /.well-known/ {
        proxy_pass http://127.0.0.1:3001/.well-known/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /userinfo {
        proxy_pass http://127.0.0.1:3001/userinfo;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ========================================
    # 兼容路径前缀方式 (向后兼容)
    # ========================================

    location /v1/claudecode/ {
        rewrite ^/v1/claudecode/(.*) /$1 break;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
    }

    # ========================================
    # 测试和健康检查
    # ========================================

    location /api/hello {
        proxy_pass http://127.0.0.1:3001/api/hello;
        proxy_http_version 1.1;
    }

    location /v1/oauth/hello {
        proxy_pass http://127.0.0.1:3001/v1/oauth/hello;
        proxy_http_version 1.1;
    }
}

# ========================================
# 使用说明
# ========================================
#
# 1. 安装配置：
#    cp nginx-dns-hijack.conf /etc/nginx/conf.d/
#    nginx -t
#    systemctl reload nginx
#
# 2. 配置DNS劫持：
#    # 客户端 /etc/hosts
#    59.110.40.73  api.anthropic.com
#
# 3. 使用Claude Code：
#    export ANTHROPIC_BASE_URL="https://api.anthropic.com"
#    export ANTHROPIC_API_KEY="sk-any"
#    claude-code
#
# 4. 验证：
#    curl -k https://api.anthropic.com/v1/models
#    curl -k https://59.110.40.73/v1/models
#
# ========================================
