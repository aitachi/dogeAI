[package]
name = "api-gateway"
version = "2.0.0"
edition = "2021"
authors = ["API Gateway Team"]
description = "Token API Gateway with rate limiting, caching, and billing"

[dependencies]
# Web框架
axum = { version = "0.7", features = ["multipart", "ws"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["trace", "cors", "compression-br", "compression-gzip", "limit", "request-id"] }
hyper = { version = "1.0", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"

# 异步运行时
tokio = { version = "1.35", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Redis和缓存
redis = { version = "0.24", features = ["tokio-comp", "connection-manager", "cluster", "aio"] }
moka = { version = "0.12", features = ["future"] }

# 数据库
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "chrono", "uuid", "json"] }

# 错误处理
thiserror = "1.0"
anyhow = "1.0"

# 时间处理
chrono = { version = "0.4", features = ["serde"] }

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# UUID
uuid = { version = "1.6", features = ["v4", "serde"] }

# 配置解析
toml = "0.8"
config = "0.14"

# HTTP客户端（用于上游代理）
reqwest = { version = "0.11", features = ["json", "stream", "rustls-tls"] }

# 限流
governor = "0.6"

# 工具库
async-trait = "0.1"
async-stream = "0.3"
futures = "0.3"
bytes = "1.5"

[dev-dependencies]
tower-test = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
