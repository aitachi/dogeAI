[package]
name = "two-level-cache"
version = "0.1.0"
edition = "2021"

[dependencies]
# L1: 本地 LRU 缓存
lru = "0.12"
# L2: Redis 客户端
redis = { version = "0.27", features = ["tokio-comp", "connection-manager", "aio"] }
# 异步运行时
tokio = { version = "1", features = ["full"] }
# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# 时间处理
chrono = "0.4"
# 错误处理
thiserror = "1"
# 命令行解析
clap = { version = "4", features = ["derive"] }
# 随机数生成 (用于测试)
rand = "0.8"
# 原子操作
atomic = "0.6"

[[bin]]
name = "cache-server"
path = "src/main.rs"
