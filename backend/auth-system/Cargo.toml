[package]
name = "auth-system"
version = "2.0.0"
edition = "2021"
authors = ["Auth System Team"]
description = "High-performance JWT authentication system with multi-layer caching"

[dependencies]
# JWT相关
jsonwebtoken = "9.2"

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 异步运行时
tokio = { version = "1.35", features = ["full"] }

# 数据库
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "migrate"] }

# Redis
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }
deadpool-redis = "0.14"

# 本地缓存
moka = { version = "0.12", features = ["future"] }

# Web框架
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# 时间处理
chrono = { version = "0.4", features = ["serde"] }

# 配置解析
config = "0.14"
toml = "0.8"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 错误处理
thiserror = "1.0"
anyhow = "1.0"

# 工具
uuid = { version = "1.6", features = ["v4", "serde"] }
once_cell = "1.19"

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"

[lib]
name = "auth_system"
path = "src/lib.rs"

[[example]]
name = "server"
path = "examples/server.rs"

# 启用 sqlx 离线模式 (编译时不需要数据库)
[sqlx]
offline = true
