[package]
name = "billing-gateway"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"

[dependencies]
# Web框架
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors", "compression-br", "compression-gzip", "fs"] }
hyper = { version = "1.0", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json"] }

# 异步运行时
tokio = { version = "1.35", features = ["full", "rt-multi-thread"] }

# 数据库
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio", "chrono", "json", "macros", "uuid"] }

# Redis
redis = { version = "0.24", features = ["tokio-comp", "connection-manager", "aio"] }

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 时间处理
chrono = { version = "0.4", features = ["serde"] }

# 错误处理
anyhow = "1.0"
thiserror = "1.0"

# 环境变量
dotenvy = "0.15"

# 随机数和哈希
rand = "0.8"
sha2 = "0.10"
base64 = "0.21"

# UUID
uuid = { version = "1.6", features = ["v4", "serde"] }

# 流式处理
async-stream = "0.3"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 限流
governor = "0.6"
nonzero_ext = "0.3"

# 定时任务
tokio-cron-scheduler = "0.9"
