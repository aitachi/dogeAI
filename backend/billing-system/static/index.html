<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aitachi 计费网关</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        .portal-container {
            text-align: center;
            padding: 40px;
        }

        .logo {
            font-size: 64px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 48px;
            color: white;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .subtitle {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 60px;
        }

        .portal-cards {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .portal-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 280px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .portal-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .portal-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .portal-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #333;
        }

        .portal-desc {
            font-size: 14px;
            color: #888;
            margin-bottom: 20px;
        }

        .portal-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
        }

        .portal-card.client .portal-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .portal-card.admin .portal-btn {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: white;
        }

        .portal-card:hover .portal-btn {
            transform: scale(1.05);
        }

        .features {
            margin-top: 60px;
            display: flex;
            gap: 40px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .feature {
            color: rgba(255, 255, 255, 0.9);
            text-align: center;
        }

        .feature-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .feature-text {
            font-size: 14px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 32px;
            }

            .portal-cards {
                flex-direction: column;
                align-items: center;
            }

            .portal-card {
                width: 100%;
                max-width: 320px;
            }
        }
    </style>
</head>
<body>
    <div class="portal-container">
        <div class="logo">⚡</div>
        <h1>Aitachi 计费网关</h1>
        <p class="subtitle">AI 模型 API 计费与管理平台</p>

        <div class="portal-cards">
            <div class="portal-card client" onclick="goTo('client')">
                <div class="portal-icon">👤</div>
                <div class="portal-title">客户端门户</div>
                <div class="portal-desc">用户登录、余额查询、充值管理、使用记录</div>
                <button class="portal-btn">进入门户</button>
            </div>

            <div class="portal-card admin" onclick="goTo('admin')">
                <div class="portal-icon">⚙️</div>
                <div class="portal-title">管理端驾驶舱</div>
                <div class="portal-desc">用户管理、计费记录、充值码、模型监控、系统配置</div>
                <button class="portal-btn">进入管理</button>
            </div>
        </div>

        <div class="features">
            <div class="feature">
                <div class="feature-icon">🤖</div>
                <div class="feature-text">多模型支持</div>
            </div>
            <div class="feature">
                <div class="feature-icon">💰</div>
                <div class="feature-text">灵活计费</div>
            </div>
            <div class="feature">
                <div class="feature-icon">⚡</div>
                <div class="feature-text">实时限流</div>
            </div>
            <div class="feature">
                <div class="feature-icon">📊</div>
                <div class="feature-text">数据统计</div>
            </div>
        </div>
    </div>

    <script>
        function goTo(portal) {
            window.location.href = portal + '.html';
        }
    </script>
</body>
</html>
